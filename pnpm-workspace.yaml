# pnpm 11 以降は package.json の pnpm フィールドを読まないため、ここにも同じ設定を置く。
# Vercel のビルドは pnpm 9 系なので package.json 側の設定も残してある。
# packages は pnpm 9 がこのファイルを読むときに必須。省くと install が落ちる。
packages:
  - "."
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  lefthook: true
  sharp: true
  unrs-resolver: true
overrides:
  react-loader-spinner>react: ^19.2.5
  react-loader-spinner>react-dom: ^19.2.5
  react-scrollbar-size>react: ^19.2.5
  stylelint-css-modules-no-global-scoped-selector>stylelint: 16.26.1
  stylelint-no-unused-selectors>stylelint: 16.26.1
  zod: 3.25.76
