# worktree で lefthook が走るたび、.husky の hook がそのツリーの
# node_modules を指す絶対パスに書き換わっていた。暗黙の再インストールを
# 止める。lefthook.yml を変えたときは lefthook install を手で叩くこと。
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "**/*.{ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "**/*"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    secretlint:
      glob: "**/*"
      # 角括弧はそのまま渡す。実在する道筋は先に見に行くので、App Router の
      # [locale] でも当たる。逆に \[ で打ち消すと、どれにも当たらず落ちる。
      run: pnpm exec secretlint --maskSecrets {staged_files}
    stylelint:
      glob: "**/*.css"
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    # 経路の型（.next/types）を作り直してから確かめる。古いままだと、足した
    # ページや消したページの型を見ずに判定してしまう。
    typescript:
      run: pnpm type-check
commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash
# main へ直接 push するので、PR の検査より前にここで止める。
pre-push:
  commands:
    test:
      run: pnpm test
