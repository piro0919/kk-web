pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "**/*.{ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "**/*"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    secretlint:
      glob: "**/*"
      # 角括弧はそのまま渡す。実在する道筋は先に見に行くので、App Router の
      # [locale] でも当たる。逆に \[ で打ち消すと、どれにも当たらず落ちる。
      run: pnpm exec secretlint --maskSecrets {staged_files}
    stylelint:
      glob: "**/*.css"
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    typescript:
      run: pnpm exec tsc --noEmit
commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash
